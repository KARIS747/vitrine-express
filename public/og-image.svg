<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid dots pattern -->
  <g opacity="0.15">
    <circle cx="100" cy="100" r="2" fill="#fff" />
    <circle cx="200" cy="100" r="2" fill="#fff" />
    <circle cx="300" cy="100" r="2" fill="#fff" />
    <circle cx="400" cy="100" r="2" fill="#fff" />
    <circle cx="500" cy="100" r="2" fill="#fff" />
    <circle cx="600" cy="100" r="2" fill="#fff" />
    <circle cx="700" cy="100" r="2" fill="#fff" />
    <circle cx="800" cy="100" r="2" fill="#fff" />
    <circle cx="900" cy="100" r="2" fill="#fff" />
    <circle cx="1000" cy="100" r="2" fill="#fff" />
    <circle cx="1100" cy="100" r="2" fill="#fff" />

    <circle cx="100" cy="200" r="2" fill="#fff" />
    <circle cx="200" cy="200" r="2" fill="#fff" />
    <circle cx="300" cy="200" r="2" fill="#fff" />
    <circle cx="400" cy="200" r="2" fill="#fff" />
    <circle cx="500" cy="200" r="2" fill="#fff" />
    <circle cx="600" cy="200" r="2" fill="#fff" />
    <circle cx="700" cy="200" r="2" fill="#fff" />
    <circle cx="800" cy="200" r="2" fill="#fff" />
    <circle cx="900" cy="200" r="2" fill="#fff" />
    <circle cx="1000" cy="200" r="2" fill="#fff" />
    <circle cx="1100" cy="200" r="2" fill="#fff" />

    <circle cx="100" cy="300" r="2" fill="#fff" />
    <circle cx="200" cy="300" r="2" fill="#fff" />
    <circle cx="300" cy="300" r="2" fill="#fff" />
    <circle cx="400" cy="300" r="2" fill="#fff" />
    <circle cx="500" cy="300" r="2" fill="#fff" />
    <circle cx="600" cy="300" r="2" fill="#fff" />
    <circle cx="700" cy="300" r="2" fill="#fff" />
    <circle cx="800" cy="300" r="2" fill="#fff" />
    <circle cx="900" cy="300" r="2" fill="#fff" />
    <circle cx="1000" cy="300" r="2" fill="#fff" />
    <circle cx="1100" cy="300" r="2" fill="#fff" />
  </g>

  <!-- Glowing decorative orbs -->
  <circle cx="1050" cy="150" r="220" fill="#059669" opacity="0.25" filter="blur(60px)" />
  <circle cx="950" cy="450" r="180" fill="#F59E0B" opacity="0.15" filter="blur(50px)" />

  <!-- Badge Pill -->
  <rect x="100" y="90" width="220" height="42" rx="21" fill="#065F46" stroke="#10B981" stroke-width="1.5" />
  <circle cx="124" cy="111" r="6" fill="#10B981" />
  <text x="142" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#A7F3D0" letter-spacing="1">VITRINE EXPRESS</text>

  <!-- Main Headline -->
  <text x="100" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
    Vendez plus vite
  </text>
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" fill="#34D399" letter-spacing="-1.5">
    directement sur WhatsApp.
  </text>

  <!-- Subheadline -->
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#CBD5E1">
    Vitrines produits mobiles, catalogue en ligne rapide &amp; panier multi-articles
  </text>
  <text x="100" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">
    spécialement conçus pour les commerçants du Cameroun et d&apos;Afrique.
  </text>

  <!-- Highlights / Features badges -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="210" height="52" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#F8FAFC">⚡ Chargement Éclair</text>

    <!-- Pill 2 -->
    <rect x="230" y="0" width="230" height="52" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="254" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#F8FAFC">🛍️ Panier WhatsApp</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="210" height="52" rx="14" fill="#1E293B" stroke="#334155" />
    <text x="504" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#F8FAFC">📱 Offline &amp; PWA</text>
  </g>
</svg>
